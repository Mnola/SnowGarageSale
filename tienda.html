<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Items</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="titulo">m&m's garage sale</h1>

<div class="grid">

  <div class="producto">

    <div class="carousel">

      <img src="./images/botasNordica10.jpeg" class="active" onclick="openModal(this)">
      <img src="./images/botasNordica2.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica3.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica4.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica5.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica6.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica7.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica8.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica9.jpeg" onclick="openModal(this)">
      <img src="./images/botasNordica1.jpeg" onclick="openModal(this)">

      <button onclick="prev(this)">◀</button>
      <button onclick="next(this)">▶</button>

    </div>

    <div class="info">
      <h2>Botas de Ski Nordica</h2>

      <p class="descripcion">
        Botas de ski en excelente estado. Ideales para montaña, cómodas y resistentes.
      </p>

      <p class="precio">$80.000</p>

      <a class="btn" href="https://wa.me/549XXXXXXXXX">WhatsApp</a>
    </div>

  </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-btn left" onclick="prevLightbox(event)">◀</button>
  <img id="lightboxImg">
  <button class="lb-btn right" onclick="nextLightbox(event)">▶</button>
</div>

<script>
let currentImages = [];
let currentIndex = 0;

function next(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index+1)%imgs.length].classList.add("active");
}

function prev(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index-1+imgs.length)%imgs.length].classList.add("active");
}

// OPEN LIGHTBOX CON CARRUSEL
function openModal(img){

  const carousel = img.closest(".carousel");
  const imgs = carousel.querySelectorAll("img");

  currentImages = [...imgs].map(i => i.src);
  currentIndex = [...imgs].findIndex(i => i.src === img.src);

  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// NEXT LIGHTBOX
function nextLightbox(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentImages.length;
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// PREV LIGHTBOX
function prevLightbox(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// CLOSE LIGHTBOX
function closeLightbox(e){
  if (e.target.id === "lightbox") {
    document.getElementById("lightbox").style.display = "none";
  }
}
</script>

</body>
</html>
