<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Items</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="titulo">m&m's garage sale</h1>

<div class="grid">

  <div class="producto">

    <div class="galeria">

      <div class="carousel">
        <img src="./images/botasNordica1.jpeg" class="active" onclick="openModal(this)">
        <img src="./images/botasNordica2.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica3.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica4.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica5.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica6.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica7.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica8.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica9.jpeg" onclick="openModal(this)">
        <img src="./images/botasNordica10.jpeg" onclick="openModal(this)">

        <button onclick="prev(this)">◀</button>
        <button onclick="next(this)">▶</button>
      </div>

    </div>

    <div class="info">
      <h2>Botas de Ski Nordica</h2>

      <p class="descripcion">
        Botas de ski en excelente estado. Ideales para montaña, cómodas y resistentes.
      </p>

      <p class="precio">$80.000</p>

      <a class="btn" href="https://wa.me/549XXXXXXXXX">WhatsApp</a>
    </div>

  </div>

</div>

<!-- Modal imagen grande -->
<div id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function next(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index+1)%imgs.length].classList.add("active");
}

function prev(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index-1+imgs.length)%imgs.length].classList.add("active");
}

// Lightbox
function openModal(img){
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = img.src;
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
