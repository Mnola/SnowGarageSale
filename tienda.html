<script>

const productos = [
  {
    nombre: "Botas de Ski Nordica",
    precio: "US$ 320",
    descripcion: `Marca: Nordica<br>
                  Hombre<br>
                  Flex 80<br>
                  Talle 28/28.5 - 325 mm<br>
                  Nuevas sin uso`,
    imagenes: [
      "./images/botasNordica1.jpeg",

    ]

  // 👉 ACÁ AGREGÁS MÁS PRODUCTOS
  {
    nombre: "Casco de Ski",

    descripcion: "Casco en excelente estado",
    imagenes: [
      "./images/casco1.jpeg",
      "./images/casco2.jpeg"
    ]
  }
];

const contenedor = document.getElementById("productos");

productos.forEach(producto => {

  const div = document.createElement("div");
  div.className = "producto";

  div.innerHTML = `
    <div class="carousel">
      ${producto.imagenes.map((img, i) =>
        `<img src="${img}" class="${i === 0 ? "active" : ""}" onclick="openModal(this)">`
      ).join("")}
      <button onclick="prev(this)">◀</button>
      <button onclick="next(this)">▶</button>
    </div>

    <div class="info">
      <h2>${producto.nombre}</h2>
      <p class="descripcion">${producto.descripcion}</p>
      <p class="precio">${producto.precio}</p>
      <a class="btn whatsapp-btn" href="#" data-product="${producto.nombre}">
        WhatsApp
      </a>
    </div>
  `;

  contenedor.appendChild(div);
});

// activar botones de whatsapp
document.addEventListener("click", function(e){
  if(e.target.classList.contains("whatsapp-btn")){
    e.preventDefault();

    const producto = e.target.dataset.product;
    const mensaje = `Hola, quiero consultar por: ${producto}`;
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;

    window.open(url, "_blank");
  }
});
</script>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox(event)">
  <button class="lb-btn left" onclick="prevLightbox(event)">◀</button>
  <img id="lightboxImg">
  <button class="lb-btn right" onclick="nextLightbox(event)">▶</button>
</div>

<script>
let currentImages = [];
let currentIndex = 0;

function next(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index+1)%imgs.length].classList.add("active");
}

function prev(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index-1+imgs.length)%imgs.length].classList.add("active");
}

// OPEN LIGHTBOX CON CARRUSEL
function openModal(img){

  const carousel = img.closest(".carousel");
  const imgs = carousel.querySelectorAll("img");

  currentImages = [...imgs].map(i => i.src);
  currentIndex = [...imgs].findIndex(i => i.src === img.src);

  document.getElementById("lightbox").style.display = "flex";
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// NEXT LIGHTBOX
function nextLightbox(e){
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % currentImages.length;
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// PREV LIGHTBOX
function prevLightbox(e){
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
  document.getElementById("lightboxImg").src = currentImages[currentIndex];
}

// CLOSE LIGHTBOX
function closeLightbox(e){
  if (e.target.id === "lightbox") {
    document.getElementById("lightbox").style.display = "none";
  }
}
</script>
