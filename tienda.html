<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="titulo">Equipamiento Outdoor</h1>

<div class="grid">

  <div class="producto">
    <h2>Campera térmica</h2>

    <div class="carousel">
      <img src="./images/botasNordica1.jpg" class="active">
      <img src="./images/botasNordica2.jpg">
      <img src="./images/botasNordica3.jpg">
      <img src="./images/botasNordica4.jpg">
      <img src="./images/botasNordica5.jpg">
      <img src="./images/botasNordica6.jpg">
      <img src="./images/botasNordica7.jpg">
      <img src="./images/botasNordica8.jpg">
      <img src="./images/botasNordica9.jpg">
      <img src="./images/botasNordica10.jpg">

      <button onclick="prev(this)">◀</button>
      <button onclick="next(this)">▶</button>
    </div>

    <p class="precio">$80.000</p>

    <a class="btn" href="https://wa.me/549XXXXXXXXX">WhatsApp</a>

  </div>

</div>

<script>
function next(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index+1)%imgs.length].classList.add("active");
}

function prev(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index-1+imgs.length)%imgs.length].classList.add("active");
}
</script>

</body>
</html>
