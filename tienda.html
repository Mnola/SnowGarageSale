<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🛍️ Productos</h1>

<div class="producto">
  <h2>Zapatillas Nike</h2>

  <!-- Carrusel -->
  <div class="carousel">
    <img src="img1.jpg" class="active">
    <img src="img2.jpg">
    <img src="img3.jpg">

    <button onclick="prev(this)">◀</button>
    <button onclick="next(this)">▶</button>
  </div>

  <p>$50.000</p>

  <a href="https://wa.me/549XXXXXXXXX?text=Hola!%20Quiero%20ofertar%20por%20Zapatillas">
    WhatsApp
  </a>

  <form action="https://formspree.io/f/TU_ID" method="POST">
    <input type="text" name="nombre" placeholder="Nombre" required>
    <input type="number" name="oferta" placeholder="Oferta" required>
    <button type="submit">Ofertar</button>
  </form>

</div>

<script>
function next(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index+1)%imgs.length].classList.add("active");
}

function prev(btn){
  let imgs = btn.parentElement.querySelectorAll("img");
  let index = [...imgs].findIndex(img => img.classList.contains("active"));
  imgs[index].classList.remove("active");
  imgs[(index-1+imgs.length)%imgs.length].classList.add("active");
}
</script>

</body>
</html>
